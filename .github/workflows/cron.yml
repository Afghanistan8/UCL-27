# UCL '27 Predict — manual endpoint runner
#
# THIS WORKFLOW IS NOT THE SCHEDULER.
# ----------------------------------
# Scheduling is handled by cron-job.org (see README -> Scheduling). GitHub's
# `schedule:` trigger was deliberately removed because:
#   - it is best-effort and commonly runs several minutes late, and can skip
#     ticks entirely under load, and
#   - GitHub disables scheduled workflows after 60 days without a push, which
#     is a real risk across the MD6 (Dec 2026) -> MD7 (Jan 2027) winter gap.
#
# What this file IS for: firing any endpoint on demand from the Actions tab,
# without needing a terminal or the CRON_SECRET on your clipboard. Handy for
# forcing a standings refresh, kicking a stuck resolve, or running
# mark-postponed against a called-off fixture.
#
# SETUP (one time)
# ----------------
# Add a repository secret named CRON_SECRET matching the CRON_SECRET env var on
# the Vercel cron project:
#   Settings -> Secrets and variables -> Actions -> New repository secret
# The repo is PUBLIC, so the token must live in Secrets and never inline here.
#
# Optionally set a CRON_BASE_URL repository *variable* if the cron project is
# ever renamed.

name: cron

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: Endpoint to run
        required: true
        default: standings
        type: choice
        options:
          - standings
          - live-scores
          - resolve-matches
          - predict-matches
          - mark-postponed
          - all

concurrency:
  group: cron-manual
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve which endpoint(s) to hit
        id: pick
        run: |
          IN="${{ github.event.inputs.endpoint }}"
          if [ "$IN" = "all" ]; then
            EPS="standings live-scores resolve-matches predict-matches"
          else
            EPS="${IN:-standings}"
          fi
          echo "endpoints=$EPS" >> "$GITHUB_OUTPUT"
          echo "Will call: $EPS"

      - name: Call endpoint(s)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://ucl27-predict-cron.vercel.app' }}
        run: |
          set -uo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          FAILED=0
          for EP in ${{ steps.pick.outputs.endpoints }}; do
            echo "::group::/api/$EP"

            # --max-time 120 comfortably exceeds the 60s Vercel maxDuration.
            # --retry covers transient edge/network blips, not app-level errors.
            CODE=$(curl -sS \
                    --max-time 120 \
                    --retry 2 --retry-delay 5 --retry-connrefused \
                    -o /tmp/out.json \
                    -w '%{http_code}' \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    "${BASE_URL}/api/${EP}") || CODE=000

            echo "HTTP $CODE"
            # Response bodies contain match ids and counts only — no secrets.
            head -c 2000 /tmp/out.json 2>/dev/null || true
            echo ""

            if [ "$CODE" != "200" ]; then
              echo "::error::/api/$EP returned HTTP $CODE"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          exit $FAILED
